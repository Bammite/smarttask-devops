<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTask - Application de Gestion de Tâches</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- En-tête -->
        <header class="app-header">
            <h1>SmartTask <span>DevOps</span></h1>
            <p>Gestionnaire de tâches collaboratif</p>
        </header>

        <!-- Formulaire d'ajout de tâche -->
        <section class="task-form-container">
            <form id="task-form">
                <input type="text" id="task-title" placeholder="Titre de la tâche..." required>
                <select id="task-priority">
                    <option value="low">Basse</option>
                    <option value="medium" selected>Moyenne</option>
                    <option value="high">Haute</option>
                    <option value="urgent">Urgente</option>
                </select>
                <button type="submit" id="add-btn">+ Ajouter</button>
            </form>
        </section>

        <!-- Tableau des tâches (Kanban) -->
        <main class="task-board">
            <!-- Colonne À faire -->
            <div class="task-column" id="col-todo">
                <h2>À faire <span class="counter" id="count-todo">0</span></h2>
                <div class="task-list" id="list-todo"></div>
            </div>

            <!-- Colonne En cours -->
            <div class="task-column" id="col-in_progress">
                <h2>En cours <span class="counter" id="count-in_progress">0</span></h2>
                <div class="task-list" id="list-in_progress"></div>
            </div>

            <!-- Colonne Terminé -->
            <div class="task-column" id="col-done">
                <h2>Terminé <span class="counter" id="count-done">0</span></h2>
                <div class="task-list" id="list-done"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
